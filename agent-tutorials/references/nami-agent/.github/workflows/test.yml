name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install openai pytest
      - name: 语法检查（全部 11 课 + 网页端）
        run: python -m compileall -q lessons web
      - name: 网页端冒烟测试（演示模式，不需要 API Key）
        run: |
          python web/app.py --demo --port 8765 &
          sleep 3
          curl -sf http://localhost:8765/api/state | grep -q lesson-11
          curl -sf http://localhost:8765/ | grep -q NamiAgent
      - name: 测试（第 3 课起，用假模型，不需要 API Key）
        run: |
          for d in lessons/lesson-*; do
            if [ -d "$d/tests" ]; then
              echo "::group::$d"
              (cd "$d" && python -m pytest -q) || exit 1
              echo "::endgroup::"
            fi
          done
