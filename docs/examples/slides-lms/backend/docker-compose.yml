# 一键启动 PostgreSQL 16（与 application.yml 默认 profile 对应）
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: slides_lms
      POSTGRES_USER: slides
      POSTGRES_PASSWORD: slides_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
