packages:
  - apps/*
  - packages/*

# pnpm 12 reads build-script approvals from this file (not from package.json).
allowBuilds:
  '@google/genai': true
  '@livekit/local-inference': true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# The LiveKit agent package and the LiveKit plugins must share one instance of
# @livekit/agents, otherwise their nominally identical classes (for example the
# VAD type) are considered different types by TypeScript.
resolvePeersFromWorkspaceRoot: true
