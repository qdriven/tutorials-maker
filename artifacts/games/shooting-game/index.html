<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>疾速靶场 · 60 秒射击挑战</title>
<style>
  :root {
    --bg: #0b1020;
    --text: #e7ecf7;
    --muted: #8b96b3;
    --accent: #38bdf8;
    --danger: #f87171;
    --panel: rgba(13, 20, 40, 0.86);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #1b2547 0%, var(--bg) 55%) fixed;
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; }
  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    cursor: none;
    touch-action: none;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: stretch;
    padding: 12px 18px;
    pointer-events: none;
    gap: 10px;
  }
  .hud-box {
    background: var(--panel);
    border: 1px solid rgba(139, 150, 179, 0.25);
    border-radius: 12px;
    padding: 8px 16px;
    min-width: 118px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .hud-label { font-size: 11px; letter-spacing: 2px; color: var(--muted); }
  .hud-value {
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .hud-sub { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hud-value.danger { color: var(--danger); animation: pulse 0.9s infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }

  /* ---------- 覆盖层 ---------- */
  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(5, 8, 18, 0.62);
    backdrop-filter: blur(4px);
    z-index: 10;
    transition: opacity 0.25s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card {
    background: var(--panel);
    border: 1px solid rgba(139, 150, 179, 0.28);
    border-radius: 18px;
    padding: clamp(22px, 4vw, 40px) clamp(24px, 5vw, 52px);
    text-align: center;
    max-width: min(92vw, 560px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  h1 {
    font-size: clamp(28px, 6vw, 44px);
    letter-spacing: 6px;
    background: linear-gradient(120deg, #7dd3fc, #a3e635 45%, #fb923c 80%, #f87171);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { margin-top: 8px; color: var(--muted); font-size: 14px; }
  .legend {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
    margin: 22px 0 6px;
  }
  .legend-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
  }
  .legend-item .name { display: flex; align-items: center; gap: 7px; color: var(--text); }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--c);
    box-shadow: 0 0 8px var(--c);
    flex: none;
  }
  .legend-item .pts { color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend-note { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 3px;
    color: #06121f;
    background: linear-gradient(120deg, #38bdf8, #4ade80);
    border: none;
    border-radius: 12px;
    padding: 13px 42px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 10px 26px rgba(56, 189, 248, 0.35);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(56, 189, 248, 0.45); }
  button:active { transform: translateY(0); }
  .hint { margin-top: 14px; font-size: 12px; color: var(--muted); }
  .hint kbd {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 5px;
    padding: 1px 7px;
    font-family: inherit;
  }

  /* 结算 */
  #finalScore {
    font-size: clamp(48px, 10vw, 76px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    background: linear-gradient(120deg, #facc15, #fb923c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .new-record {
    display: inline-block;
    margin-top: 4px;
    padding: 3px 12px;
    border-radius: 999px;
    background: rgba(250, 204, 21, 0.15);
    border: 1px solid rgba(250, 204, 21, 0.5);
    color: #facc15;
    font-size: 12px;
    letter-spacing: 2px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 22px 0 26px;
  }
  .stat {
    background: rgba(255, 255, 255, 0.04);
    border-radius: 10px;
    padding: 10px 6px;
  }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">得分 SCORE</div>
      <div class="hud-value" id="hudScore">0</div>
      <div class="hud-sub">纪录 <span id="hudBest">0</span></div>
    </div>
    <div class="hud-box">
      <div class="hud-label">时间 TIME</div>
      <div class="hud-value" id="hudTime">60</div>
      <div class="hud-sub">秒</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">命中 HITS</div>
      <div class="hud-value" id="hudHits">0</div>
      <div class="hud-sub">命中率 <span id="hudAcc">–</span></div>
    </div>
  </div>

  <!-- 开始界面 -->
  <div class="overlay" id="startOverlay">
    <div class="card">
      <h1>疾速靶场</h1>
      <div class="subtitle">60 秒内射中尽可能多的目标 · 目标速度分 5 档，越快分越高</div>
      <div class="legend" id="legend"></div>
      <div class="legend-note">目标越小、飞得越快，分值越高</div>
      <button id="startBtn">开始挑战</button>
      <div class="hint"><kbd>空格</kbd> 开始 / 重开 · 鼠标点击或触屏射击</div>
    </div>
  </div>

  <!-- 结算界面 -->
  <div class="overlay hidden" id="endOverlay">
    <div class="card">
      <div class="hud-label">本局得分 FINAL SCORE</div>
      <div id="finalScore">0</div>
      <div class="new-record" id="newRecord" style="display:none">🏆 新纪录！</div>
      <div class="stats">
        <div class="stat"><b id="stHits">0</b><span>命中目标</span></div>
        <div class="stat"><b id="stShots">0</b><span>射击次数</span></div>
        <div class="stat"><b id="stAcc">–</b><span>命中率</span></div>
        <div class="stat"><b id="stBest">0</b><span>历史最佳</span></div>
      </div>
      <button id="againBtn">再来一局</button>
      <div class="hint">按 <kbd>空格</kbd> 立即重开</div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= 常量 ================= */
const DURATION = 60;     // 单局时长（秒）——计分单位时间
const MAX_TARGETS = 9;   // 同屏目标上限
const HIT_SLOP = 5;      // 命中判定放宽（像素）
const BEST_KEY = 'shooter-best-score';

// 速度层级（索引 0..4 对应 Lv.1..Lv.5）：越快的目标越小、分越高、出现概率越低
const TIERS = [
  { color: '#38bdf8', label: '迟缓', size: 46, speed: 70,  points: 10, weight: 28 },
  { color: '#4ade80', label: '平稳', size: 40, speed: 125, points: 20, weight: 26 },
  { color: '#facc15', label: '迅捷', size: 34, speed: 190, points: 30, weight: 20 },
  { color: '#fb923c', label: '疾风', size: 28, speed: 265, points: 40, weight: 15 },
  { color: '#f87171', label: '闪电', size: 23, speed: 350, points: 50, weight: 11 },
];

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const elScore = $('hudScore'), elTime = $('hudTime'), elHits = $('hudHits'),
      elAcc = $('hudAcc'), elBest = $('hudBest');
const startOverlay = $('startOverlay'), endOverlay = $('endOverlay');

/* ================= 状态 ================= */
const game = {
  state: 'ready',        // ready | playing | over
  score: 0, hits: 0, shots: 0,
  timeLeft: DURATION,
  best: loadBest(),
  targets: [], particles: [], floats: [], misses: [],
  spawnTimer: 0.3,
  pointer: { x: innerWidth / 2, y: innerHeight / 2, in: false },
  recoil: 0,             // 射击准星后座动画 0..1
  hover: -1,             // 当前悬停目标下标
};

let W = 0, H = 0, DPR = 1, speedScale = 1, clock = 0;

/* ================= 工具 ================= */
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;

function loadBest() { try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} }

/* ================= 音效（WebAudio，无外部资源） ================= */
let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
}
function tone(f0, f1, dur, type, vol) {
  if (!actx) return;
  try {
    const t0 = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const playHit  = i => tone(320 + i * 70, 620 + i * 120, 0.12, 'triangle', 0.16);
const playMiss = () => tone(150, 85, 0.1, 'sawtooth', 0.06);
const playStart = () => tone(330, 660, 0.18, 'sine', 0.12);
const playEnd = () => tone(520, 200, 0.5, 'sine', 0.12);

/* ================= 画布尺寸 ================= */
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  speedScale = Math.max(0.7, Math.min(1.5, W / 1000)); // 大屏目标更快，保持相对难度
}
addEventListener('resize', resize);
resize();

/* ================= 目标生成 ================= */
function pickTier() {
  const total = TIERS.reduce((s, t) => s + t.weight, 0);
  let r = Math.random() * total;
  for (let i = 0; i < TIERS.length; i++) { r -= TIERS[i].weight; if (r <= 0) return i; }
  return 0;
}

function makeTarget(idx, x, y, vx, vy) {
  const t = TIERS[idx];
  const r = t.size * (W < 640 ? 0.85 : 1);
  game.targets.push({ idx, x, y, vx, vy, r, points: t.points, color: t.color, born: clock });
}

function spawnTarget() {
  const idx = pickTier();
  const spd = TIERS[idx].speed * speedScale;
  const jitter = () => (Math.random() - 0.5) * 0.8; // 与入射边法线夹角 ±23° 左右
  let x, y, vx, vy, a;
  const side = (Math.random() * 4) | 0; // 0 左 1 右 2 上 3 下
  const m = TIERS[idx].size + 10;
  if (side === 0)      { x = -m;      y = rand(H * 0.15, H * 0.85); a = jitter(); }
  else if (side === 1) { x = W + m;   y = rand(H * 0.15, H * 0.85); a = Math.PI + jitter(); }
  else if (side === 2) { y = -m;      x = rand(W * 0.12, W * 0.88); a = Math.PI / 2 + jitter(); }
  else                 { y = H + m;   x = rand(W * 0.12, W * 0.88); a = -Math.PI / 2 + jitter(); }
  vx = Math.cos(a) * spd; vy = Math.sin(a) * spd;
  makeTarget(idx, x, y, vx, vy);
}

/* ================= 特效 ================= */
function burst(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(110, 330);
    game.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(1.8, 3.6), life: rand(0.35, 0.6), max: 0.6, color });
  }
}
function addFloat(x, y, text, color) { game.floats.push({ x, y, text, color, life: 0.85, max: 0.85 }); }

/* ================= 射击 ================= */
function shoot(x, y) {
  game.shots++;
  game.recoil = 1;
  for (let i = game.targets.length - 1; i >= 0; i--) {
    const t = game.targets[i];
    const d = Math.hypot(x - t.x, y - t.y);
    if (d <= t.r + HIT_SLOP) {
      game.targets.splice(i, 1);
      game.hits++;
      game.score += t.points;   // 命中即按目标层级加分：越快分越高
      burst(t.x, t.y, t.color);
      addFloat(t.x, t.y - t.r - 6, '+' + t.points, t.color);
      playHit(t.idx);
      updateHud();
      return;
    }
  }
  game.misses.push({ x, y, life: 0.45, max: 0.45 });
  playMiss();
  updateHud();
}

/* ================= 流程 ================= */
function startGame() {
  game.state = 'playing';
  game.score = 0; game.hits = 0; game.shots = 0;
  game.timeLeft = DURATION;
  game.targets.length = 0; game.particles.length = 0;
  game.floats.length = 0; game.misses.length = 0;
  game.spawnTimer = 0.35;
  startOverlay.classList.add('hidden');
  endOverlay.classList.add('hidden');
  playStart();
  updateHud();
}

function endGame() {
  game.state = 'over';
  const isRecord = game.score > game.best && game.score > 0;
  if (isRecord) { game.best = game.score; saveBest(game.best); }
  $('finalScore').textContent = game.score;
  $('stHits').textContent = game.hits;
  $('stShots').textContent = game.shots;
  $('stAcc').textContent = game.shots ? Math.round(game.hits / game.shots * 100) + '%' : '–';
  $('stBest').textContent = game.best;
  $('newRecord').style.display = isRecord ? '' : 'none';
  endOverlay.classList.remove('hidden');
  playEnd();
  updateHud();
}

function updateHud() {
  elScore.textContent = game.score;
  elHits.textContent = game.hits;
  elTime.textContent = Math.max(0, Math.ceil(game.timeLeft));
  elTime.classList.toggle('danger', game.state === 'playing' && game.timeLeft <= 10);
  elAcc.textContent = game.shots ? Math.round(game.hits / game.shots * 100) + '%' : '–';
  elBest.textContent = game.best;
}

/* ================= 更新 ================= */
function update(dt) {
  clock += dt;

  // 计时
  if (game.state === 'playing') {
    game.timeLeft -= dt;
    if (game.timeLeft <= 0) { game.timeLeft = 0; endGame(); }
  }

  // 生成：随时间推移刷得更快；非游戏中保留少量环境飘动目标
  game.spawnTimer -= dt;
  if (game.spawnTimer <= 0) {
    if (game.state === 'playing') {
      if (game.targets.length < MAX_TARGETS) spawnTarget();
      const prog = 1 - game.timeLeft / DURATION;             // 0 → 1
      const interval = lerp(0.95, 0.5, prog);                // 0.95s → 0.5s
      game.spawnTimer = interval * rand(0.75, 1.25);
    } else {
      if (game.targets.length < 5) spawnTarget();
      game.spawnTimer = 1.4;
    }
  }

  // 目标移动 / 出界移除
  for (let i = game.targets.length - 1; i >= 0; i--) {
    const t = game.targets[i];
    t.x += t.vx * dt; t.y += t.vy * dt;
    const m = t.r + 90;
    if (clock - t.born > 0.4 && (t.x < -m || t.x > W + m || t.y < -m || t.y > H + m)) {
      game.targets.splice(i, 1);
    }
  }

  // 粒子 / 飘字 / 脱靶标记
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 1 - 3 * dt; p.vy = p.vy * (1 - 3 * dt) + 260 * dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
  for (let i = game.floats.length - 1; i >= 0; i--) {
    const f = game.floats[i];
    f.life -= dt; f.y -= 46 * dt;
    if (f.life <= 0) game.floats.splice(i, 1);
  }
  for (let i = game.misses.length - 1; i >= 0; i--) {
    game.misses[i].life -= dt;
    if (game.misses[i].life <= 0) game.misses.splice(i, 1);
  }

  game.recoil = Math.max(0, game.recoil - dt * 6);

  // 悬停目标（用于高亮）
  game.hover = -1;
  for (let i = game.targets.length - 1; i >= 0; i--) {
    const t = game.targets[i];
    if (Math.hypot(game.pointer.x - t.x, game.pointer.y - t.y) <= t.r + HIT_SLOP) { game.hover = i; break; }
  }

  updateHud();
}

/* ================= 绘制 ================= */
function drawTarget(t, hovered) {
  const age = Math.min(1, (clock - t.born) / 0.18);   // 出场放大
  const scale = 0.3 + 0.7 * age;
  const r = t.r * scale;

  // 运动拖尾（沿速度反方向的 3 个残影）
  const k = 0.045;
  const tra = [0.85, 0.68, 0.52], alp = [0.16, 0.09, 0.05];
  for (let j = 0; j < 3; j++) {
    ctx.globalAlpha = alp[j];
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.arc(t.x - t.vx * k * (j + 1), t.y - t.vy * k * (j + 1), r * tra[j], 0, Math.PI * 2);
    ctx.fill();
  }

  // 光晕
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = t.color;
  ctx.beginPath(); ctx.arc(t.x, t.y, r * 1.3, 0, Math.PI * 2); ctx.fill();

  // 靶环
  ctx.globalAlpha = 1;
  ctx.lineWidth = 3;
  ctx.strokeStyle = t.color;
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.arc(t.x, t.y, r * 0.62, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = t.color;
  ctx.beginPath(); ctx.arc(t.x, t.y, r * 0.25, 0, Math.PI * 2); ctx.fill();

  if (hovered) {
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.arc(t.x, t.y, r + 6, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 背景网格
  ctx.strokeStyle = 'rgba(139,150,179,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 64) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 64) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // 脱靶标记
  for (const m of game.misses) {
    const a = m.life / m.max, s = 9;
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#f87171';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(m.x - s, m.y - s); ctx.lineTo(m.x + s, m.y + s);
    ctx.moveTo(m.x + s, m.y - s); ctx.lineTo(m.x - s, m.y + s);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 目标（后生成的画在上层，先判定也优先）
  game.targets.forEach((t, i) => drawTarget(t, i === game.hover));

  // 粒子
  for (const p of game.particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 得分飘字
  ctx.textAlign = 'center';
  ctx.font = '700 20px "Segoe UI", "PingFang SC", sans-serif';
  for (const f of game.floats) {
    ctx.globalAlpha = Math.max(0, f.life / f.max);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // 准星（仅游戏中、指针在场内时）
  if (game.state === 'playing' && game.pointer.in) {
    const { x, y } = game.pointer;
    const rr = 1 + game.recoil * 0.35;
    const col = game.hover >= 0 ? game.targets[game.hover].color : 'rgba(231,236,247,0.9)';
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.6;
    const g = 7 * rr, L = 16 * rr;
    ctx.beginPath();
    ctx.moveTo(x - L, y); ctx.lineTo(x - g, y);
    ctx.moveTo(x + g, y); ctx.lineTo(x + L, y);
    ctx.moveTo(x, y - L); ctx.lineTo(x, y - g);
    ctx.moveTo(x, y + g); ctx.lineTo(x, y + L);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 12 * rr, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
  }
}

/* ================= 主循环 ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); // 后台切回不跳帧/不扣时
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= 输入 ================= */
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  game.pointer.x = e.clientX; game.pointer.y = e.clientY; game.pointer.in = true;
  if (game.state === 'playing') shoot(e.clientX, e.clientY);
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('pointermove', e => { game.pointer.x = e.clientX; game.pointer.y = e.clientY; game.pointer.in = true; });
canvas.addEventListener('pointerleave', () => { game.pointer.in = false; });

addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'Enter') && game.state !== 'playing') {
    e.preventDefault();
    ensureAudio();
    startGame();
  }
});

$('startBtn').addEventListener('click', () => { ensureAudio(); startGame(); });
$('againBtn').addEventListener('click', () => { ensureAudio(); startGame(); });

/* ================= 开始界面图例（数据单一来源） ================= */
$('legend').innerHTML = TIERS.map((t, i) =>
  `<div class="legend-item">
     <span class="name"><span class="dot" style="--c:${t.color}"></span>Lv.${i + 1} ${t.label}</span>
     <span class="pts">${t.points} 分</span>
   </div>`).join('');

/* ================= 调试 / 自动化测试钩子 ================= */
window.__game = game;
game.start = startGame;
game.shoot = shoot;
game.debugSpawn = (x, y, idx) => makeTarget(idx ?? 0, x, y, 0, 0);

updateHud();
})();
</script>
